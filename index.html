<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>DEVClubConverter</title>
</head>

<body>

    <img class="logo" src="./assets/logo.gif" alt="Logo">

    <main>
<label>
    converter <b>de</b>
    <select class="origin-select">
      <option value="real">R$ Real Brasileiro</option>
      <option value="euro">Euro€</option>
    </select>

    converter <b>para</b>

   <select class="currency-select">

      <option value="dolar">US$ Dólar Americano</option>
      <option value="euro">Euro€</option>
      <option value="bitcoin">₿ Bitcoin</option>
      <option value="dolar-canadense">C$ Dólar Canadense</option>

    </select>
</label>

        <label>
            Valor
            <input placeholder="R$10.0000" class="input">
        </label>

        <button class="convert-button">Converter</button>

        <section>

            <div class="flex">
                <img src="./assets/brasil 2.png" alt="brasil" class="bandeira-brasil">
                <p class="p3">Real</p>
                <p class="p4">R$0,00 </p>
            </div>

            <div>
                <img src="./assets/Vector.png" alt="seta" class="seta">
            </div>

        <div class="flex">

    <img src="./assets/estados-unidos (1) 1.png" alt="Estados Unidos" class="currency-img">
     <p class="p1" id="currency-name">Dólar Americano</p>
     <p class="p2">US$0,00</p>

</div>
        </section>

    </main>

    <script src="arquivo.js"></script>

</body>
</html>
